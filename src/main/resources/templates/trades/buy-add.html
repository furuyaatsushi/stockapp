<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>株の買い増し</title>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<h1>株の追加購入</h1>

<form th:action="@{/trades/buy/add}" method="post">

    <div>
        <label>銘柄コード</label>
        <select name="stockId" required>
            <option th:each="stock : ${stocks}"
                    th:value="${stock.stockId}"
                    th:text="${stock.stockCode + ' ' + stock.stockName}">
            </option>
        </select>
    </div>

    <div>
        <label>数量</label>
        <input type="number" name="quantity" required>
    </div>

    <div>
        <label>価格</label>
        <input type="number" name="price" step="0.01" required>
    </div>

    <div>
        <label>取引日</label>
        <input type="date" name="tradeDate" required>
    </div>

    <button type="submit">購入</button>

</form>

<p>
    <a href="/trades">一覧に戻る</a>
</p>

</body>
</html>
