<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>株の買い増し</title>
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="container">

    <div class="form-card">

        <div class="form-title">株の追加購入</div>

        <form th:action="@{/trades/buy/add}"
              th:object="${addBuyRequest}"
              method="post">

            <!-- hidden -->
            <input type="hidden" th:field="*{stockId}" />
            <input type="hidden" th:field="*{accountType}" />

            <!-- 銘柄情報（固定表示） -->
            <div class="form-group">
                <label>銘柄</label>
                <div>
                    <span th:text="${stock.stockCode}"></span>
                    <span th:text="${stock.stockName}"></span>
                </div>
            </div>

            <!-- 口座種別（日本語表示 + 色分け） -->
            <div class="form-group">
                <label>口座種別</label>
                <div th:text="${accountType.displayName}"
                     th:classappend="${accountType.displayName == 'NISA'} ? 'nisa-label' : 'taxable-label'">
                </div>
            </div>

            <!-- 数量 -->
            <div class="form-group">
                <label>数量（株）</label>
                <input type="number" th:field="*{quantity}" required min="1">
            </div>

            <!-- 価格 -->
            <div class="form-group">
                <label>価格（円）</label>
                <input type="number" th:field="*{price}" required min="0">
            </div>

            <!-- 日付（デフォルト今日） -->
            <div class="form-group">
                <label>取引日</label>
                <input type="date"
                       th:field="*{tradeDate}"
                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                       required>
            </div>

            <!-- ボタン -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">追加購入する</button>
                <a href="/stocks" class="btn">戻る</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
