<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>売却</title>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<h2>株式売却</h2>

<div th:if="${errorMessage}" style="color:red">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/trades/sell}"
      th:object="${sellRequest}"
      method="post">

    <div>
        <label>銘柄</label>

        <select th:field="*{stockId}" id="stockSelect" required>
            <option th:each="holding : ${holdings}"
                    th:value="${holding.stockId}"
                    th:data-account="${holding.accountType}"
                    th:text="${holding.stockCode + ' '
                            + holding.stockName
                            + ' ('
                            + (holding.accountType == T(com.example.stockapp.entity.AccountType).NISA ? 'NISA' : '特定')
                            + ' / 保有:' + holding.quantity + ')'}">
            </option>
        </select>
    </div>

    <input type="hidden" th:field="*{accountType}" id="accountType"/>

    <div>
        <label>売却価格</label>
        <input type="number"
               step="1"
               th:field="*{price}"
               required />
    </div>

    <div>
        <label>数量</label>
        <input type="number" th:field="*{quantity}" required />
    </div>

    <div>
        <label>売却日</label>
        <input type="date" th:field="*{tradeDate}" required />
    </div>

    <button type="submit">売却</button>

</form>

<script>

    const select = document.getElementById("stockSelect");
    const accountInput = document.getElementById("accountType");

    function updateAccountType() {
        const selected = select.options[select.selectedIndex];
        accountInput.value = selected.dataset.account;
    }

    select.addEventListener("change", updateAccountType);

    // 初期値
    updateAccountType();

</script>
