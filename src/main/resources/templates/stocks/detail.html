<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>銘柄詳細</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{layout/header :: header}"></div>
<div class="container">

    <!-- ================= -->
    <!-- 銘柄情報 -->
    <!-- ================= -->
    <div class="section header">
        <h1>
            <span th:text="${stock.stockCode}"></span>
            <span th:text="${stock.stockName}"></span>
        </h1>
    </div>

    <!-- ================= -->
    <!-- 保有情報 -->
    <!-- ================= -->
    <div class="section">

        <h2>保有情報</h2>

        <div th:if="${#lists.isEmpty(holdings)}">
            <p>保有データがありません</p>
        </div>

        <div class="account-container">

            <div th:each="h : ${holdings}"
                 th:class="'account-card ' + (${h.accountType.name()} == 'NISA' ? 'nisa' : 'taxable')">

                <div class="account-title">
                    <span th:text="${h.accountType}"></span>
                </div>

                <div class="info-row">
                    <span>株数</span>
                    <span th:text="${h.quantity} + ' 株'"></span>
                </div>

                <div class="info-row">
                    <span>平均取得</span>
                    <span>¥<span th:text="${#numbers.formatInteger(h.averagePrice, 0, 'COMMA')}"></span></span>
                </div>

                <div class="info-row">
                    <span>投資額</span>
                    <span>¥<span th:text="${#numbers.formatInteger(h.totalBuyAmount, 0, 'COMMA')}"></span></span>
                </div>

                <div class="info-row highlight">
                    <span>評価額</span>
                    <span>¥<span th:text="${#numbers.formatInteger(h.holdingAmount, 0, 'COMMA')}"></span></span>
                </div>

                <!-- ボタン -->
                <div class="actions">
                    <a class="btn btn-buy"
                       th:href="@{/trades/buy/add/{stockId}/{accountType}
                       (stockId=${h.stockId}, accountType=${h.accountType})}">
                        買い増し
                    </a>

                    <a class="btn btn-secondary"
                       th:href="@{/dividends/add/{stockId}/{accountType}
                       (stockId=${h.stockId}, accountType=${h.accountType})}">
                        配当登録
                    </a>
                </div>

            </div>

        </div>

    </div>

    <!-- ================= -->
    <!-- 配当履歴 -->
    <!-- ================= -->
    <div class="section">

        <h2>配当履歴</h2>

        <table class="stock-table">

            <thead>
            <tr>
                <th>日付</th>
                <th class="right">配当額</th>
                <th>口座</th>
                <th>メモ</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="d : ${dividends}">
                <td th:text="${d.dividendDate}"></td>

                <td class="right">
                    ¥<span th:text="${#numbers.formatInteger(d.amount, 0, 'COMMA')}"></span>
                </td>

                <td th:text="${d.accountType}"></td>
                <td th:text="${d.memo}"></td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
